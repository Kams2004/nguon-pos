# LAN testing only: the same routing as pos.nguonevents.com.conf, served
# over HTTPS with a self-signed certificate (nginx/certs/, gitignored), so
# other machines on the local network get a secure context — the PWA needs
# one for crypto.subtle (QR signing) and its service worker. Enabled via
# docker-compose.lan.yml; production keeps using the real domain + cert.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/lan.crt;
    ssl_certificate_key /etc/nginx/certs/lan.key;

    client_max_body_size 10m;

    # Behind the VPS's own nginx: take the caller's address from it (rate limits).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Service-to-service endpoints and the tills' certificate channel are
    # never served on this site.
    location ~ ^/api/[a-z]+/[a-z]+/internal/ {
        return 404;
    }
    location ^~ /api/sales/edge/ {
        return 404;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/sales/ {
        proxy_pass http://sales-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    # Uploaded images (media library) — straight from the public-read MinIO
    # bucket. Object keys are random UUIDs, so they can be cached for long.
    # MinIO is resolved per request (Docker DNS), not at startup, so nginx —
    # and the whole app — still starts when MinIO is down; only images fail.
    # Desktop till installers (deploy/release/publish-release.sh). Public:
    # each till checks the release signature before installing anything.
    location ^~ /releases/ {
        alias /usr/share/nginx/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        resolver 127.0.0.11 valid=10s;
        set $minio_upstream minio:9000;
        rewrite ^/media/(.*)$ /nguon-media/$1 break;
        proxy_pass http://$minio_upstream;
        proxy_set_header Host minio:9000;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://pos-pwa:80/;
        include /etc/nginx/proxy_params.conf;
    }
}

# Local stand-in for edge.pos.nguonevents.com (the VPS's host nginx does this
# in production): mutual TLS with the device CA, then the till channel.
server {
    listen 8444 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/lan.crt;
    ssl_certificate_key /etc/nginx/certs/lan.key;
    ssl_client_certificate /etc/nginx/device-ca/ca-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location = /edge/v1/ws {
        proxy_pass http://sales-service:8080/edge/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
