# Path-based routing to the three backend services + the PWA static build.
# Placeholder domain pos.nguonevents.com — swap once real DNS is confirmed
# (see "Open items" in docs/ARCHITECTURE.md).
#
# NOTE on proxy_pass and container restarts: these proxy_pass targets use
# plain hostnames (not variables) deliberately — a variable-based proxy_pass
# (e.g. `set $u http://auth-service:8080; proxy_pass $u;`) stops nginx from
# stripping the location's matched prefix from the proxied URI, so a request
# to /api/auth/actuator/health gets passed through as the literal path
# /api/auth/actuator/health instead of /actuator/health, which doesn't match
# anything on the backend and silently 403s via Spring Security's
# default-deny rule. (Found and fixed during local testing — costly to
# rediscover.) The tradeoff: nginx resolves these hostnames once at startup,
# so redeploying a backend service requires restarting nginx too — deploy.sh
# does this automatically after every service redeploy.
server {
    listen 80 default_server;
    # Catch-all: this nginx instance serves only this one app, so there's no
    # other virtual host to disambiguate against — match the real domain and
    # any other Host header alike (bare IP, localhost during local testing).
    server_name pos.nguonevents.com _;

    client_max_body_size 10m;

    # Behind the VPS's own nginx: take the caller's address from it (rate limits).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Service-to-service endpoints and the tills' certificate channel are
    # never served on this site.
    location ~ ^/api/[a-z]+/[a-z]+/internal/ {
        return 404;
    }
    location ^~ /api/sales/edge/ {
        return 404;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/sales/ {
        proxy_pass http://sales-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    # Uploaded images (media library) — straight from the public-read MinIO
    # bucket. Object keys are random UUIDs, so they can be cached for long.
    # MinIO is resolved per request (Docker DNS), not at startup, so nginx —
    # and the whole app — still starts when MinIO is down; only images fail.
    # Desktop till installers (deploy/release/publish-release.sh). Public:
    # each till checks the release signature before installing anything.
    location ^~ /releases/ {
        alias /usr/share/nginx/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        resolver 127.0.0.11 valid=10s;
        set $minio_upstream minio:9000;
        rewrite ^/media/(.*)$ /nguon-media/$1 break;
        proxy_pass http://$minio_upstream;
        proxy_set_header Host minio:9000;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://pos-pwa:80/;
        include /etc/nginx/proxy_params.conf;
    }
}

# The desktop tills' live channel, on its own port (81), published on the
# VPS's loopback only and forwarded to solely by the host's
# edge.pos.nguonevents.com site (deploy/vps/edge.pos.nguonevents.com.conf),
# which checks the till's client certificate and sets X-Client-Verify /
# X-Client-Cert. The main site (port 80) can't reach this block whatever
# Host or headers a caller sends.
server {
    listen 81;
    server_name _;

    location = /edge/v1/ws {
        proxy_pass http://sales-service:8080/edge/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Verify $http_x_client_verify;
        proxy_set_header X-Client-Cert $http_x_client_cert;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
