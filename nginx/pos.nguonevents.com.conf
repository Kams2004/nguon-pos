# Path-based routing to the three backend services + the PWA static build.
# Placeholder domain pos.nguonevents.com — swap once real DNS is confirmed
# (see "Open items" in docs/ARCHITECTURE.md).
server {
    listen 80 default_server;
    # Catch-all: this nginx instance serves only this one app, so there's no
    # other virtual host to disambiguate against — match the real domain and
    # any other Host header alike (bare IP, localhost during local testing).
    server_name pos.nguonevents.com _;

    client_max_body_size 10m;

    location /api/auth/ {
        proxy_pass http://auth-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/sales/ {
        proxy_pass http://sales-service:8080/;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://pos-pwa:80/;
        include /etc/nginx/proxy_params.conf;
    }
}
