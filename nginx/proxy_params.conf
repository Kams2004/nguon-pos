proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The till channel's certificate verdict is only ever set by the edge.pos
# server block below; on every other route a caller-supplied value is dropped.
proxy_set_header X-Client-Verify "";
proxy_set_header X-Client-Cert "";
