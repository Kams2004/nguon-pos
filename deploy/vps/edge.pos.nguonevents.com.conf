# Host nginx on the shared VPS: /etc/nginx/sites-available/edge.pos.nguonevents.com
# The desktop tills' live channel. Only tills holding a certificate issued
# by the Nguon POS device CA can even complete the TLS handshake here;
# sales-service then checks that certificate belongs to an active till.
#
# Before enabling: the certificate for the name itself
#   sudo certbot certonly --nginx -d edge.pos.nguonevents.com
# and the device CA chain (public, no keys) at /etc/nginx/nguon-pos/device-ca-chain.pem
server {
    listen 80;
    server_name edge.pos.nguonevents.com;
    return 404;
}

server {
    listen 443 ssl;
    server_name edge.pos.nguonevents.com;

    ssl_certificate /etc/letsencrypt/live/edge.pos.nguonevents.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge.pos.nguonevents.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Mutual TLS: the till must present a certificate from the device CA.
    ssl_client_certificate /etc/nginx/nguon-pos/device-ca-chain.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location = /edge/v1/ws {
        # The stack's dedicated channel port (POS_EDGE_BIND), not the main site's.
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The verdict and the certificate, set here and nowhere else.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
