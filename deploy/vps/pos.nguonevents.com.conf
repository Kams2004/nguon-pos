# Host nginx on the shared VPS: /etc/nginx/sites-available/pos.nguonevents.com
# Forwards to the Nguon POS stack, which listens on loopback only
# (POS_HTTP_BIND=127.0.0.1:8090 in ~/nguon-pos/.env). HTTPS is added by
#   sudo certbot --nginx -d pos.nguonevents.com
# which rewrites this file with the certificate lines.
server {
    listen 80;
    server_name pos.nguonevents.com;

    # Media library uploads are capped at 5 MB by the app.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live admin updates and till presence are a long-lived event stream:
        # pass events through as they come instead of buffering them.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
