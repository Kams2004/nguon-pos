spring.application.name=edge-service

# The local API is for this machine only. LAN peers (milestone 5) get their
# own TLS connector on another port.
server.address=127.0.0.1
server.port=${EDGE_PORT:47300}
server.error.include-message=always

# Data directory: the installer points this at C:\ProgramData\NguonPOS\edge
# (Windows) or /var/lib/nguon-edge (Ubuntu).
edge.data-dir=${EDGE_DATA_DIR:data}
edge.central-url=${EDGE_CENTRAL_URL:https://pos.nguonevents.com}
edge.key-provider=${EDGE_KEY_PROVIDER:auto}
edge.sync-interval-ms=5000
# The Tauri webview's origins, plus the Vite dev server for development.
edge.allowed-origins=tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173

spring.main.banner-mode=off
logging.level.root=INFO
