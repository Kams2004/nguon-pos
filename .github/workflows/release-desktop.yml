name: Desktop till release

# Builds the installers: Windows (NSIS .exe) and Ubuntu (.deb), each with
# the till app, the local server and its own trimmed Java runtime.
# Run by pushing a tag desktop-vX.Y.Z, or by hand from the Actions tab.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported Ubuntu, so the package runs on 22.04 and newer.
          - os: ubuntu-22.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable

      - name: Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Local server + Java runtime
        shell: bash
        run: sh desktop/scripts/build-edge.sh

      - name: Windows service wrapper (WinSW)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -fsSL -o desktop/build/edge/nguon-edge.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

      - name: Till screens dependencies
        working-directory: frontend/pos-pwa
        run: npm ci

      - name: Installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: nguon-pos-${{ matrix.bundle }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
