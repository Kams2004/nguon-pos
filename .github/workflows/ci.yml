name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Java (sync-core + services)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # sync-core, then each service; the sales-service suite runs against a
      # throwaway Postgres through Testcontainers (Docker is available on the runner).
      - run: mvn -B verify

  frontend:
    name: PWA (type-check, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/pos-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/pos-pwa/package-lock.json
      - run: npm ci
      # Includes the shared QR vectors in docs/test-vectors, also checked by sync-core.
      - run: npm test
      - run: npm run build
