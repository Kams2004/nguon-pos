spring.application.name=sales-service
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nguonpos}
spring.datasource.username=${DB_USER:nguonpos}
spring.datasource.password=${DB_PASSWORD:nguonpos}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=sales
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=sales
spring.flyway.default-schema=sales
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

jwt.signing-secret=${JWT_SIGNING_SECRET:}
