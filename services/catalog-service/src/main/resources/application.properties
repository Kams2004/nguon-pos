spring.application.name=catalog-service
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nguonpos}
spring.datasource.username=${DB_USER:nguonpos}
spring.datasource.password=${DB_PASSWORD:nguonpos}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=catalog
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

jwt.signing-secret=${JWT_SIGNING_SECRET:}

# Media library (MinIO object storage) — see media/MediaStorage.java
media.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
media.minio.access-key=${MINIO_ROOT_USER:minioadmin}
media.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
media.minio.bucket=${MINIO_BUCKET:nguon-media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Surface ResponseStatusException reasons (written in French for the UI) in error bodies.
spring.web.error.include-message=always
