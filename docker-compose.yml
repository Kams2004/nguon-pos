services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-768m}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-768m}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: nguon-media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Media library storage (logo, ticket artwork, ticket-type pictures).
  # Not exposed on the host: catalog-service writes to it, nginx serves the
  # public-read bucket under /media/. MinIO no longer publishes community
  # images to Docker Hub/Quay — this pinned release must already be present
  # locally (docker save/load it onto the VPS).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - pos_minio_data:/data

  sales-service:
    build: ./services/sales-service
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-768m}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      # Device CA (issuing certificate + key) that signs the desktop tills'
      # certificates. Not in git: created with deploy/device-ca/create-ca.sh.
      - ./secrets/device-ca:/run/secrets/device-ca:ro
    depends_on:
      postgres:
        condition: service_healthy

  pos-pwa:
    build: ./frontend/pos-pwa
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      # Mounted AT default.conf (not alongside it) — the nginx:stable-alpine
      # image ships its own default.conf with server_name "localhost", which
      # otherwise wins over our pos.nguonevents.com server block for any
      # request whose Host header doesn't exactly match (e.g. localhost
      # testing, or hitting the VPS by bare IP).
      - ./nginx/pos.nguonevents.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      # Signed till installers, uploaded by deploy/release/publish-release.sh.
      - ./releases:/usr/share/nginx/releases:ro
    # On the shared VPS: POS_HTTP_BIND=127.0.0.1:8090, behind the host's
    # nginx (TLS for pos.nguonevents.com). Locally it defaults to :8081.
    ports:
      - "${POS_HTTP_BIND:-8081}:80"
      # The tills' channel: reached only by the host's edge.pos site (mutual TLS).
      - "${POS_EDGE_BIND:-127.0.0.1:8097}:81"
    depends_on:
      - auth-service
      - catalog-service
      - sales-service
      - pos-pwa
      - minio

volumes:
  pos_pg_data:
  pos_minio_data:
