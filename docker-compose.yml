services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  sales-service:
    build: ./services/sales-service
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  pos-pwa:
    build: ./frontend/pos-pwa

  nginx:
    image: nginx:stable-alpine
    volumes:
      # Mounted AT default.conf (not alongside it) — the nginx:stable-alpine
      # image ships its own default.conf with server_name "localhost", which
      # otherwise wins over our pos.nguonevents.com server block for any
      # request whose Host header doesn't exactly match (e.g. localhost
      # testing, or hitting the VPS by bare IP).
      - ./nginx/pos.nguonevents.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - auth-service
      - catalog-service
      - sales-service
      - pos-pwa

volumes:
  pos_pg_data:
