<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <g id="diamond">
      <rect x="-1" y="-1" width="2" height="2" />
    </g>
  </defs>

  <!-- large gold diamond, top-left -->
  <rect x="20" y="20" width="56" height="56" fill="#FFC72C" opacity="0.9" transform="rotate(45 48 48)" />
  <!-- large pale-blue diamond, offset -->
  <rect x="140" y="60" width="44" height="44" fill="#9FD1F0" opacity="0.55" transform="rotate(45 162 82)" />
  <!-- small gold diamond -->
  <rect x="190" y="150" width="26" height="26" fill="#FFC72C" opacity="0.8" transform="rotate(45 203 163)" />
  <!-- small outlined diamond -->
  <rect x="60" y="150" width="30" height="30" fill="none" stroke="#FFC72C" stroke-width="2" opacity="0.6" transform="rotate(45 75 165)" />
  <!-- tiny dotted grid of gold squares -->
  <g fill="#FFC72C" opacity="0.35">
    <rect x="10" y="190" width="6" height="6" transform="rotate(45 13 193)" />
    <rect x="30" y="200" width="6" height="6" transform="rotate(45 33 203)" />
    <rect x="50" y="190" width="6" height="6" transform="rotate(45 53 193)" />
    <rect x="10" y="210" width="6" height="6" transform="rotate(45 13 213)" />
    <rect x="30" y="220" width="6" height="6" transform="rotate(45 33 223)" />
  </g>
  <!-- thin diagonal accent lines -->
  <line x1="100" y1="10" x2="180" y2="40" stroke="#FFC72C" stroke-width="1.5" opacity="0.4" />
  <line x1="0" y1="110" x2="60" y2="140" stroke="#9FD1F0" stroke-width="1.5" opacity="0.4" />
</svg>
