server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or the web app manifest — a stale SW
    # registration is exactly the kind of bug that's invisible until a gate
    # laptop is offline and running old code.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are safe to cache aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
